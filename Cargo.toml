[package]
name = "bottlerocket-bootstrap-associate-eip"
version = "0.3.0"
edition = "2024"

[features]
tracing = []

[dependencies]
aws-config = { version = "1.8.12", default-features = false }
aws-sdk-ec2 = "1.200.0"
env_logger = "0.11.8"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[dev-dependencies]
chrono = "0.4.43"
const-str = "1.0.0"
hyper = { version = "1.8.1", features = ["server"] }
serde_urlencoded = "0.7.1"
tempfile = "3.24.0"
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }

[profile.release]
strip = true

[profile.release-build]
inherits = "release"
opt-level = "z"
strip = true
debug = false
lto = true
codegen-units = 1

[profile.debug-build]
inherits = "release"
opt-level = "z"
strip = false
debug = true
lto = true
codegen-units = 1
